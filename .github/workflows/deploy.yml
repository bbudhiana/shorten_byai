name: CI/CD Pipeline

on:
  push:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo
          coverage: none

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        run: php artisan test

  deploy:
    name: Deploy to VPS
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DB_PASSWORD
          script: |
            DEPLOY_DIR="/var/www/html/shortenurl.indoez.com"
            FIRST_DEPLOY=false

            if [ ! -d "$DEPLOY_DIR/.git" ]; then
              rm -rf "$DEPLOY_DIR"
              git clone https://github.com/bbudhiana/shorten_byai.git "$DEPLOY_DIR"
              FIRST_DEPLOY=true
            fi

            cd "$DEPLOY_DIR"

            git pull origin main

            cp -n .env.example .env 2>/dev/null || true

            grep -v '^DB_PASSWORD=' .env > .env.tmp
            echo "DB_PASSWORD=$DB_PASSWORD" >> .env.tmp
            mv .env.tmp .env
            sed -i "s/^APP_DEBUG=.*/APP_DEBUG=false/" .env
            sed -i "s/^APP_ENV=.*/APP_ENV=production/" .env

            rm -rf vendor composer.lock

            sudo find /etc/php -name '*psr*' -delete 2>/dev/null || true

            composer install --no-dev --optimize-autoloader

            php artisan config:clear
            php artisan key:generate --force --no-interaction

            if [ "$FIRST_DEPLOY" = true ]; then
              php artisan migrate:fresh --force
            else
              php artisan migrate --force
            fi

            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            chmod -R 775 storage bootstrap/cache

            bash /home/baban/restart_caddy_services.sh
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
