name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/baban/Projects/learn/shorturl
            git pull origin main
            docker exec frankenphp composer install --no-dev --optimize-autoloader
            docker exec frankenphp php artisan migrate --force
            docker exec frankenphp php artisan config:cache
            docker exec frankenphp php artisan route:cache
            docker exec frankenphp php artisan view:cache
